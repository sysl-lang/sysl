<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 1450 870" role="img" aria-label="sysl">
  <title>sysl</title>
  <!--
    The wordmark: "sysl" set in Iceland (Cyreal, SIL OFL), converted to outlines
    so the page needs no webfont and the shapes can never re-flow. The glyphs
    are the face's own contours placed at its own advance widths — nothing here
    was traced or redrawn, and the rounded corners are Iceland's rather than a
    softening applied to it.

    It is referenced through <img>, which cannot see `currentColor` or the host
    page's theme attribute, so the two shades are chosen by the viewer's OS
    preference instead. They are juicerdocs' own accent in each scheme.

    The viewBox carries 40 units of padding on every side. The outlines are
    flush with their own bounding box, so without it the leftmost stroke of the
    "s" and the rightmost of the "l" sit exactly on the edge and read as cut.
  -->
  <style>
    .glyphs { fill: #6f1f9e; }
    @media (prefers-color-scheme: dark) {
      .glyphs { fill: #c084fc; }
    }
  </style>
