<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 1625 1141" role="img" aria-label="sysl">
  <title>sysl</title>
  <!--
    The wordmark: "sysl" set in Iceberg (Cyreal, SIL OFL), converted to outlines
    so the page needs no webfont and the shapes can never re-flow. Every segment
    is a straight line, which is the face's own character rather than a
    simplification — nothing here was traced or redrawn.

    It is referenced through <img>, which cannot see `currentColor` or the host
    page's theme attribute, so the two shades are chosen by the viewer's OS
    preference instead. They are juicerdocs' own accent in each scheme.

    The viewBox carries 40 units of padding on every side. The outlines are
    flush with their own bounding box, so without it the leftmost stroke of the
    "s" and the rightmost of the "l" sit exactly on the edge and read as cut.
  -->
  <style>
    .glyphs { fill: #6f1f9e; }
    @media (prefers-color-scheme: dark) {
      .glyphs { fill: #c084fc; }
    }
  </style>
