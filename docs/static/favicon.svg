<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="sysl">
  <title>sysl</title>
  <!--
    The favicon is the wordmark's own "s", set in Iceberg and reversed out of a
    solid tile. A four-letter wordmark is illegible at 16px and a thin outline
    on transparent disappears against a dark browser chrome, so the tile carries
    the colour and the glyph is white in both schemes.
  -->
  <rect width="512" height="512" rx="96" fill="#6f1f9e"/>
  <g transform="translate(156 106) scale(0.578)">
    <path fill="#ffffff" d="M346 87H99V173H235L322 260V432L235 519H0V432H223V260H87L0 173V87L87 0H258Z"/>
  </g>
</svg>
