# Build & deploy the sysl documentation site.
#
#   Push to `dev`        → builds and deploys to GitHub Pages.
#   PR targeting `dev`   → builds only, as a sanity check.
#   workflow_dispatch    → manual trigger from the Actions tab.
#
# `dev` rather than `stable` because sysl has no `stable` branch: `dev` is the
# default branch and what a merged feature lands on.
#
# The site is built by juicer, which lives in its own repository and has no
# published launcher — so this workflow checks juicer out beside sysl and runs
# it from its own sbt project. When juicer ships a runnable artifact, the two
# checkout steps collapse into one and the build step loses its `working-directory`.

name: Docs

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "docs-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sysl
        uses: actions/checkout@v6
        with:
          path: sysl

      - name: Check out juicer
        uses: actions/checkout@v6
        with:
          repository: edadma/juicer
          ref: stable
          path: juicer

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # actions/setup-java does NOT ship sbt — the runner image only has the
      # JDK after the previous step.
      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v5
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('juicer/**/build.sbt', 'juicer/project/**') }}
          restore-keys: ${{ runner.os }}-sbt-

      # juicer's asset pipeline shells out to `sass` and `esbuild`. Without them
      # on PATH it degrades to the committed `static/` copies and skips
      # fingerprinting, which ships stale CSS and defeats cache busting.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install asset toolchain (sass + esbuild)
        run: npm install -g sass esbuild

      - name: Build the site
        working-directory: juicer
        run: >
          sbt 'juicerJVM/run build
          -s ${{ github.workspace }}/sysl/docs
          -d ${{ github.workspace }}/_site
          -b https://sysl.sh/'

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: _site

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
