# The sysl documentation site, built with juicer and the juicerdocs theme.
#
# This directory — the repository's `docs/` — is the site, and its pages under
# `content/` are the ones the compiler's own gate compiles, so editing a page is
# editing the site, with no copy step.
#
# Local preview (juicer has no standalone launcher yet — it is run from its
# own repo, pointed at this directory):
#
#   cd ~/dev/juicer
#   sbt 'juicerJVM/run serve -s ~/dev/sysl-lang/sysl/docs -L'
#
# Production: .github/workflows/docs.yml builds on every push to `dev` and
# every pull request, and deploys to GitHub Pages only from a release tag
# (`v*`), so the published site documents a release, never dev.

title       = "sysl"
author      = "Ed Maxedon"
baseURL     = "https://sysl.sh/"
description = "A modern, ref-counted, general-purpose systems language — easier than Rust. Four ways to name storage, no garbage collector, no borrow checker."

repoURL = "https://github.com/sysl-lang/sysl"

favicon = "favicon.svg"

# One override, for the wordmark: the topbar's brand text is hidden, because
# the wordmark already says "sysl" and the two sat side by side.
customCSS = ["site.css"]

# Two themes rather than one, and juicerapi is first because a nearer theme
# wins. It inherits juicerdocs — the topbar, sidebar, search, palette and
# typography are the same objects rather than a matching set, which is what
# keeps the generated API section and the hand-written pages reading as one
# site. It overrides no default layout: its `api-module` and `api-index`
# templates are reached by `layout:` frontmatter, which only the pages under
# `content/api/` carry, so nothing already here renders differently.
theme = ["juicerapi", "juicerdocs"]

# Every directory under `content/` is published, so nothing that is not a page
# belongs there. `examples` stays excluded so that a directory of that name
# is never walked as content.
excludeDirs = ["examples"]

# The page <h1> comes from frontmatter title — markdown headings start at h2.
headingShift = 0

# GitHub Pages serves the on-disk layout literally, so the URL space has to
# match the file tree. The `standard` baseline ships htmlDir = "html", which
# strips a segment from URLs but not from paths and breaks the deploy.
htmlDir = ""

# Recompile the theme's CSS from SCSS on every build, fingerprint for
# cache-busting, bundle the theme JS. Without `sass` / `esbuild` on PATH
# this degrades to a verbatim copy of the committed sources — the page
# still renders, it just ships whatever CSS was last committed.
[assets]
enabled     = true
fingerprint = true

[[assets.sass]]
input  = "themes/juicerdocs/src/scss/juicerdocs.scss"
output = "/juicerdocs.css"
minify = true

[[assets.esbuild]]
input  = "themes/juicerdocs/static/juicerdocs.js"
output = "/juicerdocs.js"
minify = true

[juicerdocs]
# The wordmark: "sysl" set in Iceberg (Cyreal), converted to outlines. `icon`
# is left unset so the topbar falls back to this one — there is no separate
# mark to show there, the wordmark IS the brand.
logo = "sysl-wordmark.svg"

# The hero's "Get started" CTA is on by default and links to
# /getting-started/, which is where a reader with no sysl on their
# machine has to begin. The tour follows from there.
